[project]
name = "botgeorge"
version = "1.1.0"
description = "George, the creepy gargoyle Discord bot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6,<3",
    "yt-dlp[default]>=2026.10.26",
    "segno>=1.6,<2",
    "aiohttp>=3.9,<4",
    "aiosqlite>=0.20,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
george = "george.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/george"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["prototyping"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "E501"]  # long user-facing strings are fine; ruff format handles code

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
